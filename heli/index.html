<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Helis Courage | The World of Maidah</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3efe7;
    font-family: Georgia, "Times New Roman", serif;
    color: #292929;
}

header {
    background: white;
    text-align: center;
    padding: 25px;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: normal;
}

header p {
    margin: 7px 0 0;
    color: #777;
}

.reader {
    padding: 35px 15px;
    text-align: center;
}

#book {
    width: 900px;
    height: 600px;
    max-width: 95vw;
    max-height: 70vh;
    margin: auto;
}

.page {
    background: white;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.page canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.controls {
    margin-top: 25px;
}

button {
    padding: 12px 22px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    background: #292929;
    color: white;
    font-family: Georgia, serif;
    cursor: pointer;
}

.status {
    margin-top: 15px;
    color: #777;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #292929;
    text-decoration: none;
}

@media (max-width: 700px) {
    #book {
        height: 75vh;
        max-height: 650px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Helis Courage</h1>
    <p>By Maidah Syed</p>
</header>

<div class="reader">

    <div id="book"></div>

    <div class="controls">
        <button onclick="previousPage()">← Previous</button>
        <button onclick="nextPage()">Next →</button>
    </div>

    <div class="status" id="status">
        Loading your book...
    </div>

    <a class="back" href="../index.html">
        ← Back to The World of Maidah
    </a>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let flipBook = null;

async function loadBook() {

    const status = document.getElementById("status");

    try {

        const pdf = await pdfjsLib.getDocument(
            "../Helis%20courage.pdf"
        ).promise;

        const book = document.getElementById("book");

        const pages = [];

        for (let number = 1; number <= pdf.numPages; number++) {

            status.innerText =
                "Loading page " + number + " of " + pdf.numPages + "...";

            const pdfPage = await pdf.getPage(number);

            const viewport = pdfPage.getViewport({
                scale: 1.5
            });

            const page = document.createElement("div");

            page.className = "page";

            const canvas = document.createElement("canvas");

            const context = canvas.getContext("2d");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await pdfPage.render({
                canvasContext: context,
                viewport: viewport
            }).promise;

            page.appendChild(canvas);

            pages.push(page);
        }

        flipBook = new St.PageFlip(book, {

            width: 450,
            height: 600,

            size: "stretch",

            minWidth: 280,
            maxWidth: 600,

            minHeight: 380,
            maxHeight: 800,

            showCover: true,

            mobileScrollSupport: true,

            flippingTime: 800,

            drawShadow: true,

            maxShadowOpacity: 0.4

        });

        flipBook.loadFromHTML(pages);

        status.innerText =
            "Your book is ready — turn the pages! 📖";

    } catch (error) {

        console.error(error);

        status.innerText =
            "The book could not be loaded. Please refresh the page.";

    }
}

function nextPage() {

    if (flipBook) {
        flipBook.flipNext();
    }

}

function previousPage() {

    if (flipBook) {
        flipBook.flipPrev();
    }

}

loadBook();

</script>

</body>
</html>
