<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bunty, Klicky & the Fairy of Kindness</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at 20% 20%, #f3e5ed, transparent 30%),
        radial-gradient(circle at 80% 80%, #e8def0, transparent 30%),
        #f8f1eb;

    font-family: Georgia, serif;
    color: #5d4852;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Header */

header {
    width: 100%;
    padding: 22px;

    text-align: center;

    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);

    border-bottom: 1px solid #ead9df;
}

header h1 {
    margin: 0;

    font-size: 32px;
    font-weight: 500;
}

header p {
    margin: 6px 0 0;

    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #977287;
}

/* Decorative elements */

.decoration {
    position: fixed;
    pointer-events: none;

    font-size: 28px;

    animation: float 5s ease-in-out infinite;
}

.one {
    top: 18%;
    left: 5%;
}

.two {
    top: 30%;
    right: 5%;
    animation-delay: 1s;
}

.three {
    bottom: 18%;
    left: 7%;
    animation-delay: 2s;
}

.four {
    bottom: 12%;
    right: 8%;
    animation-delay: 3s;
}

@keyframes float {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}

/* Book */

.book-container {
    width: min(900px, 94%);
    margin: 35px auto 20px;

    background: rgba(255,255,255,0.65);

    padding: 18px;

    border-radius: 18px;

    box-shadow:
        0 20px 50px rgba(90,60,80,0.15);
}

/* PDF viewer */

iframe {
    width: 100%;
    height: 70vh;

    min-height: 500px;

    border: none;

    border-radius: 10px;

    background: white;

    box-shadow:
        0 10px 30px rgba(70,45,60,0.15);
}

/* Buttons */

.controls {
    display: flex;

    justify-content: center;

    gap: 15px;

    margin: 20px 0 35px;
}

.button {
    display: inline-block;

    padding: 12px 25px;

    border-radius: 25px;

    border: 1px solid #ad7d93;

    color: #9b6d83;

    background: rgba(255,255,255,0.8);

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 12px;

    transition: 0.3s;
}

.button:hover {
    background: #ad7d93;
    color: white;

    transform: translateY(-3px);
}

/* Mobile */

@media (max-width: 600px) {

    header h1 {
        font-size: 25px;
    }

    .book-container {
        width: 96%;
        padding: 10px;
    }

    iframe {
        height: 65vh;
        min-height: 450px;
    }

    .decoration {
        font-size: 22px;
    }

}

</style>
</head>

<body>

<div class="decoration one">🦋</div>
<div class="decoration two">✦</div>
<div class="decoration three">🌸</div>
<div class="decoration four">✧</div>


<header>

<h1>
Bunty, Klicky & the Fairy of Kindness
</h1>

<p>
A story by Maidah Syed
</p>

</header>


<div class="book-container">

<iframe
src="bunty-klicky-fairy-of-kindness.pdf"
title="Bunty, Klicky & the Fairy of Kindness">
</iframe>

</div>


<div class="controls">

<a href="index.html" class="button">
← Back to Library
</a>

</div>


</body>
</html>
